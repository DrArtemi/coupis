[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coupis"
version = "0.1.0"
description = "Le super coupis project."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "DrArtemi" },
]
dependencies = [
    "alembic>=1.19.1,<2",
    "geoalchemy2>=0.20.0,<1",
    "psycopg[binary]>=3.3.5,<4",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "pygbif>=0.6.6,<0.7",
    "requests>=2.34.2,<3",
    "sqlalchemy>=2.0.52,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["coupis*"]

[tool.setuptools.package-data]
"coupis.regions.data" = ["*.wkt"]
